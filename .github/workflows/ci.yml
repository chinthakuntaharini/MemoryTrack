name: MemoryTrack CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libgtk-3-0
    
    - name: Install CI dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
    
    - name: Initialize database
      run: |
        python -c "from utils.db_manager import DatabaseManager; db = DatabaseManager(); db.init_db()"
    
    - name: Run basic tests
      run: |
        python -m pytest tests/test_memory.py tests/test_matching.py -v --tb=short
      continue-on-error: true
    
    - name: Test imports
      run: |
        python -c "
        try:
            from utils.config_loader import ConfigLoader
            from utils.db_manager import DatabaseManager
            print('✅ Basic imports successful')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=__pycache__,.git,.pytest_cache
      continue-on-error: true

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t memorytrack:test .
      continue-on-error: true

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check README links
      run: |
        # Check if all referenced files exist
        if [ ! -f "README.md" ]; then echo "README.md missing"; exit 1; fi
        if [ ! -f "SETUP.md" ]; then echo "SETUP.md missing"; exit 1; fi
        if [ ! -f "requirements.txt" ]; then echo "requirements.txt missing"; exit 1; fi
        echo "✅ All documentation files present"